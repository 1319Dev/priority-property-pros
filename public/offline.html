<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A3C2E" />
    <meta name="robots" content="noindex" />
    <title>You’re offline — Priority Property Pros</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #FBF8F1;
        color: #1A1814;
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        min-height: 100dvh;
        padding: 48px 24px calc(32px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 28rem;
        margin: 0 auto;
      }
      .mark {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: #1A3C2E;
        display: grid;
        place-items: center;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.15;
        margin: 0 0 12px;
        color: #1A3C2E;
      }
      p {
        font-family: system-ui, sans-serif;
        font-size: 1.05rem;
        line-height: 1.5;
        color: #3F3A33;
        margin: 0 0 24px;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 999px;
        background: #1A3C2E;
        color: #FBF8F1;
        text-decoration: none;
        font-family: system-ui, sans-serif;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
          <path d="M12 32 L32 14 L52 32" stroke="#C9A227" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M18 31 V50 H46 V31" stroke="#FBF8F1" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M26 50 V36 M32 50 V34 M38 50 V36" stroke="#E0C078" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>You’re offline.</h1>
      <p>
        Priority Property Pros can’t reach the network right now. When you’re back
        online, return home — your project still has one simple place.
      </p>
      <a href="./">Try the homepage</a>
    </main>
  </body>
</html>
